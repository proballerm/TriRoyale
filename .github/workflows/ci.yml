name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/triroyale_ci
      OPENAI_API_KEY: test-key-not-used-during-build
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      NEXTAUTH_SECRET: ci-only-secret-that-is-long-enough-for-jwt-encryption
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run multiplayer rule tests
        run: npm test

      - name: Type-check application
        run: npm run typecheck

      - name: Build production application
        run: npm run build
